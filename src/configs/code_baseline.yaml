defaults:
  - model: code_transformer
  - _self_
  - experiments: baseline

task: code_generation
run_name: code-baseline
run_dir: ${oc.env:HW2_RUNS_DIR,saved}/${run_name}
prepared_dir: ${oc.env:HW2_PREPARED_DIR,../data/prepared/code8k}
seed: 42
optimizer:
  lr: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.98]
  fused: true
scheduler:
  warmup_steps: 500
  minimum_ratio: 0.1
dataloader:
  batching: tokens
  token_budget: 16384
  max_batch_size: 256
  bucket_size: 3200
  num_workers: 2
trainer:
  device: auto
  amp: true
  cpu_threads: 1
  accumulation_steps: 2
  max_steps: 20000
  max_epochs: null
  max_hours: 4
  max_grad_norm: 1.0
  log_every: 20
  eval_every: 500
  val_max_batches: 0
  save_every: 1000
  keep_snapshots: 5
  resume_from: null
writer:
  mode: online
  workspace: had-a42
  project_name: NLP_HW2
hydra:
  job:
    chdir: false
